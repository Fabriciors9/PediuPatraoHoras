<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Logs de Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">
                <i class="bi bi-shield-check me-2 text-primary"></i>Trilha de Auditoria
            </h2>
            <p class="text-muted small mb-0">Histórico de alterações e operações comerciais realizadas no sistema</p>
        </div>
    </div>

    <!-- Tabela de Auditoria -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-3">Data e Hora</th>
                            <th>Usuário</th>
                            <th>Perfil</th>
                            <th>Operação</th>
                            <th>Entidade (ID)</th>
                            <th>Campo</th>
                            <th>Valor Anterior</th>
                            <th>Novo Valor</th>
                            <th>Justificativa / Detalhes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(auditorias)}">
                            <td colspan="9" class="text-center text-muted py-5">
                                <i class="bi bi-journal-x fs-3 d-block mb-2"></i>
                                Nenhum registro de auditoria gerado até o momento.
                            </td>
                        </tr>
                        <tr th:each="log : ${auditorias}">
                            <td class="ps-3 small text-nowrap">
                                <strong th:if="${log.dataHora != null}" 
                                        th:text="${#temporals.format(log.dataHora, 'dd/MM/yyyy HH:mm:ss')}"></strong>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${log.usuario}"></span>
                            </td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${log.perfil == 'ADMIN'} ? 'bg-danger' : 
                                                      (${log.perfil == 'GERENTE'} ? 'bg-warning text-dark' : 'bg-info text-dark')"
                                      th:text="${log.perfil}">
                                </span>
                            </td>
                            <td>
                                <span class="badge bg-dark" th:text="${log.tipoOperacao}"></span>
                            </td>
                            <td class="small">
                                <span class="fw-bold" th:text="${log.entidadeAfetada}"></span>
                                <div class="text-muted" th:text="'#' + ${log.idEntidade}"></div>
                            </td>
                            <td class="text-primary small" th:text="${log.campoAlterado != null ? log.campoAlterado : '-'}"></td>
                            <td class="text-danger small" th:text="${log.valorAnterior != null ? log.valorAnterior : '-'}"></td>
                            <td class="text-success small" th:text="${log.novoValor != null ? log.novoValor : '-'}"></td>
                            <td class="small">
                                <div th:if="${log.detalhe != null}" th:text="${log.detalhe}"></div>
                                <div th:if="${log.justificativa != null}" class="badge bg-danger text-wrap mt-1" 
                                     th:text="'Justificativa: ' + ${log.justificativa}"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(auditorias)}">
            Total: <strong th:text="${#lists.size(auditorias)}"></strong> registro(s)
        </div>
    </div>

</div>

</body>
</html>
