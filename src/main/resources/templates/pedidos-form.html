<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="bi bi-cart-plus me-2"></i>Registrar Novo Pedido</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">
                        
                        <!-- Seleção do Cliente -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Cliente:</label>
                            <select class="form-select" th:field="*{clienteId}" required>
                                <option value="">-- Selecione o Cliente --</option>
                                <option th:each="c : ${clientes}" 
                                        th:value="${c.nome + ' (' + c.telefone + ')'}" 
                                        th:text="${c.nome + ' - ' + c.telefone + ' (' + c.bairro + ')'}">
                                </option>
                            </select>
                        </div>

                        <!-- Produto (Tamanho padrão de 8 fatias) -->
                        <input type="hidden" name="tipoPizza" value="8 fatias" />

                        <div class="mb-3">
                            <label class="form-label fw-bold">Produto:</label>
                            <select class="form-select" th:field="*{sabor}" id="selectProduto" onchange="atualizarPreco(this)" required>
                                <option value="" data-preco="0">-- Selecione o Produto --</option>
                                <option th:each="p : ${produtos}" 
                                        th:value="${p.nome}" 
                                        th:data-preco="${p.preco}"
                                        th:text="${p.nome}">
                                </option>
                            </select>
                        </div>

                        <!-- Quantidade e Preço Unitário -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Quantidade:</label>
                                <input type="number" class="form-control" th:field="*{quantidade}" min="1" value="1" required />
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Preço Unitário (R$):</label>
                                <input type="number" step="0.01" min="0" class="form-control bg-light" id="inputPreco" th:field="*{precoUnitario}" readonly required />
                            </div>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/pedidos}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Voltar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Confirmar Pedido
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function atualizarPreco(select) {
            const opcaoSelecionada = select.options[select.selectedIndex];
            const preco = opcaoSelecionada.getAttribute('data-preco');
            if (preco && parseFloat(preco) > 0) {
                document.getElementById('inputPreco').value = parseFloat(preco).toFixed(2);
            }
        }
    </script>

</div>

</body>
</html>
